[package]
name = "nodectl"
version = "0.1.0"
edition = "2024"
description = "Transactional configuration management for a bare-metal Xray node"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
minijinja = "2"
rand = "0.8"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
lto = true
strip = true

