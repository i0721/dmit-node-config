name: Quality and lifecycle gates
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - run: rustup show active-toolchain
      - run: bash scripts/check-all.sh
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with: {command: check advisories licenses sources}
      - name: Official Xray compatibility
        run: |
          python3 scripts/download-xray.py /tmp/nodectl-xray
          XRAY_TEST_BINARY=/tmp/nodectl-xray cargo test --locked upstream_xray_accepts -- --ignored
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  integration:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ['debian:12', 'debian:13', 'ubuntu:24.04', 'ubuntu:26.04']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Clean systemd environment, real services, network and lifecycle
        run: sudo bash scripts/test-integration.sh '${{ matrix.image }}'
      - name: Keep sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-${{ strategy.job-index }}
          path: dist/integration-*.log
          if-no-files-found: error
