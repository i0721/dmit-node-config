name: Quality and lifecycle gates
on:
  # Full lifecycle validation is opt-in; release packaging does not repeat it.
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_integration:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - run: rustup show active-toolchain
      - run: bash scripts/check-all.sh
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with: {command: check advisories licenses sources}
      - name: Official Xray compatibility
        run: |
          cargo run --quiet --locked --bin repo-tools -- download-xray /tmp/nodectl-xray
          cargo run --quiet --locked --bin repo-tools -- download-mihomo /tmp/nodectl-mihomo
          XRAY_TEST_BINARY=/tmp/nodectl-xray MIHOMO_TEST_BINARY=/tmp/nodectl-mihomo cargo test --locked upstream_ -- --ignored
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  admin-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.11.1'}
      - name: Prepare frontend test tools
        working-directory: webui
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Static UI, real Rust API, HTTPS, policy and lifecycle acceptance
        run: bash scripts/test-admin.sh
      - name: Keep sanitized admin evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-console-evidence
          path: |
            dist/admin-runtime.log
            webui/docs/changes/112-dmit-console/evidence/*.png
          if-no-files-found: error
  integration:
    if: ${{ !inputs.skip_integration }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, image: 'debian:12'}
          - {runner: ubuntu-24.04, image: 'debian:13'}
          - {runner: ubuntu-24.04, image: 'ubuntu:24.04'}
          - {runner: ubuntu-24.04, image: 'ubuntu:26.04'}
          - {runner: ubuntu-24.04-arm, image: 'debian:12'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Clean systemd environment, real services, network and lifecycle
        run: sudo bash scripts/test-integration.sh '${{ matrix.image }}'
      - name: Keep sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-${{ strategy.job-index }}
          path: dist/integration-*.log
          if-no-files-found: error
