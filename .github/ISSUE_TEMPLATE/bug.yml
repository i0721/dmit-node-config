name: Bug report
description: Report a reproducible problem without credentials
body:
  - type: input
    id: version
    attributes: {label: nodectl version and OS/architecture}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Minimal sanitized reproduction and expected/actual behavior}
    validations: {required: true}
  - type: textarea
    id: checks
    attributes: {label: Sanitized doctor/status results, last successful step and recovery result}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: No UUIDs, keys, tokens, certificates, WARP JSON or full exported profiles are attached.
          required: true
