<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线测速 · Network Lab</title><link rel="stylesheet" href="/site.css"><script src="/librespeed/speedtest.js" defer></script><script src="/librespeed/test.js" defer></script></head><body><header><a class="brand" href="/">◈ Network Lab</a><nav><a href="/">返回首页</a></nav></header><main class="test-main"><div class="eyebrow">LIBRESPEED / LIVE MEASUREMENTS</div><h1>测量此刻的连接。</h1><p class="intro">浏览器与本站之间的真实传输测试。关闭大流量应用，有助于获得更稳定的结果。</p><div class="metrics"><div class="metric"><span>下载速度</span><strong id="download">—</strong><small>Mbps</small></div><div class="metric"><span>上传速度</span><strong id="upload">—</strong><small>Mbps</small></div><div class="metric"><span>延迟</span><strong id="ping">—</strong><small>ms</small></div><div class="metric"><span>抖动</span><strong id="jitter">—</strong><small>ms</small></div></div><progress id="progress" value="0" max="1" aria-label="测速进度"></progress><p id="status" class="test-status" role="status">测试尚未开始。测速会产生实际流量，结果受网络、设备和服务负载影响。</p><div class="actions"><button id="start" class="button primary">开始测速 ↗</button><button id="stop" class="button secondary" disabled>停止测试</button></div><p class="note">Powered by LibreSpeed · 不记录测速结果，不向第三方发送 IP 查询。</p></main><footer><a href="https://github.com/librespeed/speedtest-go" rel="noreferrer">LibreSpeed · LGPL-3.0</a><a href="/downloads/test.bin" download>下载测试文件 ↓</a></footer></body></html>
