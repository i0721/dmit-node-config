# No implicit downloads or upgrades. Cargo.lock pins all Rust dependencies.
# check records SHA256 of installed executables. apply refuses changed files.
[go]
version = "1.27.2"
metadata_url = "https://go.dev/dl/?mode=json&include=all"

[xray]
repository = "https://github.com/XTLS/Xray-core"
version = "26.10.10"
ref = "v26.10.10"
linux_amd64_url = "https://github.com/XTLS/Xray-core/releases/download/v26.10.10/Xray-linux-64.zip"
linux_amd64_archive_sha256 = "72a5fde819713a103c6fc26a87aa025c1518c918a34eba4bc38d64dc0728e5d9"
linux_arm64_url = "https://github.com/XTLS/Xray-core/releases/download/v26.10.10/Xray-linux-arm64-v8a.zip"
linux_arm64_archive_sha256 = "58e339e67827220175b3a1c6f66f48ccd086b79209f30ba1c0bcb47885d4c22a"

[nginx]
repository = "https://github.com/nginx/nginx"
required_features = ["TLSv1.3", "http_v2", "http_v3"]
pin_policy = "installed-sha256-in-check-receipt"

[mihomo]
version = "1.19.32"
linux_amd64_url = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz"
linux_amd64_archive_sha256 = "ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20"
linux_arm64_url = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-arm64-v1.19.32.gz"
linux_arm64_archive_sha256 = "9dd862e28b46ff7d775f169cceebc28deccaa0a9e804237d421cd2571e0caba0"

[usque]
repository = "https://github.com/Diniboy1123/usque"
version = "4.2.1"
ref = "v4.2.1"
source_commit = "6aa03fc97d12848dce34eedbd187fb1077b5d1ea"
required_mode = "nativetun"
pin_policy = "installed-sha256-in-check-receipt"

[acme]
repository = "https://github.com/acmesh-official/acme.sh"
version = "3.1.6"
ref = "3.1.6"
source_commit = "807da6498377ee5e0cf43a78091f46f12dc59a89"
policy = "operator-provisioned; never executed by render/apply"
