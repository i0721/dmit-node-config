schema_version: 1
id: R097-001
title: '三层 Motion 模型与异步内容切换（AsyncRegion）契约参数'
question: '现有 frontend 架构应如何把动效治理升级为 Policy + Recipe + Semantic Component 三层，并落地 Async Content Transition（Loading→Skeleton→crossfade→Ready）以解决"数据 Ready 但内容突然出现"？其消费方与契约参数是什么？'
research_type: current-state-audit-and-contract-design
topics:
  [
    'frontend',
    'motion governance',
    'async content transition',
    'motion recipe',
    'motion policy',
    'motion region',
  ]
keywords:
  [
    'AsyncRegion',
    'screen transition',
    'viewport reveal',
    'content.enter recipe',
    'sceneMode',
    'presence lifecycle',
  ]
applicable_scenarios:
  [
    'frontend Motion 治理体系化、异步内容切换组件、页面 Region 级 Reveal 的未来决策、开发期 Motion Inspector 规划',
  ]
non_applicable_scenarios:
  [
    '为异步状态建立 LoadingAnimationContainer 万能容器',
    '每个 UI Element/表格行套 Viewport 动画',
    '视口 presence 滚动重播动画（后台场景）',
    '业务页面直接选择 fade/slide 等实现型动画契约',
  ]
status: active
summary: '异步内容"突然出现"源于两个独立维度：数据是否 Ready 与是否进入视口。解决它的正确组件是 AsyncRegion（语义组件，消费方=reference page 的 sceneMode 状态机），而非 ViewportReveal。治理体系升级为三层：Recipe 属于组件实现、Feature 只选 Semantic Component、两层 Policy（用户环境+开发期 Override）解析成最终 Motion。'
