schema_version: 1
id: R098-002
title: 'Universal Form、i18n 与 UI/Motion 公共契约研究'
question: '如何在不复制第三方 API、不引入后端语义的前提下，把 Form、i18n、Accessibility 与 Motion 收敛为跨 Product Surface 的稳定 Frontend Foundation？'
research_type: official-contract-and-boundary-design
topics: ['react-hook-form', 'zod', 'i18next', 'HeroUI', 'motion', 'accessibility']
keywords: ['formState', 'Controller', 'supportedLngs', 'fallbackLng', 'ZodType', 'React Aria']
applicable_scenarios: ['通用表单编排、语言运行时、UI Element 扩展、Motion Primitive 分层']
non_applicable_scenarios: ['业务 Schema、API DTO、服务端校验、业务翻译资源']
status: active
summary: '沿用 RHF+Zod 与 i18next 成熟能力，但只收口重复且稳定的编排语义；字段定义、Schema、文案和业务状态仍由 Feature/Surface 提供。HeroUI/React Aria 继续拥有交互与 Accessibility，Motion 参数继续由 Token/Policy 单源管理。'
