<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人账户常驻表单验收预览</title>
  <style>
    body {
      font-family: system-ui;
      margin: 24px;
      color: #172033;
      background: #f7f7fa;
    }
    section {
      margin: 28px 0;
    }
    img {
      width: 100%;
      border: 1px solid #ddd;
    }
    figure {
      margin: 0;
    }
    a {
      color: inherit;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    figcaption {
      font-weight: 600;
      margin: 12px 0;
    }
    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

  <h1>个人账户：常驻表单与轻量内联操作</h1>
  <p>
    按最终确认方案：个人资料、账户安全、有效登录会话三个轻边框区段。资料重置／保存资料，密码清空／修改密码；操作行紧随字段，无
    Sticky、Fixed、独立背景或浮层阴影。
  </p>
  <p>资料与密码直接在页面编辑。只保留未保存离开与会话撤销确认。当前没有申请更新视觉基线。</p>
