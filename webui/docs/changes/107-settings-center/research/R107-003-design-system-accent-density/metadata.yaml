applicable_scenarios:
  [
    '107 设置中心外观/可访问性语义映射、四强调色、密度/字号/对比度 token 扩展、日期选择器 locale/weekStart、表格 Resizable/列能力、TailAdmin 复核门禁',
  ]
non_applicable_scenarios:
  ['把 HEX/CSS Token 暴露给普通用户、任意键位编辑器、自定义圆角/阴影/间距设计器']
status: active
summary: '现状只有 light/dark + 单套 brand 紫；外观/可访问性所需的强调色×对比度×密度×字号/内容宽度语义映射需在 design-system.schema.json 受控区段增补并由 codegen:design 生成；四套强调色（紫=现 --ds-brand 系列，蓝/绿/橙从受控色板新增）以语义 token（--ds-accent-* 或 --color-brand 系列切换）表达；DataTable 列宽复用 HeroUI v3 ResizableContainer/ColumnResizer 经 ui-adapter 语义封装；DatePicker locale/weekStart 需装配 RAC I18nProvider 或透传 firstDayOfWeek；TailAdmin 外部复核是 SET-002 硬门禁（表格/Tabs/表单/通知四组 + 状态矩阵），网络不可达必须记录 blocker 不得标完成。'
