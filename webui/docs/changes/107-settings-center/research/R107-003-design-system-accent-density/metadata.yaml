title: '107 Design System 主题扩展与视觉校准基线研究'
question: '外观/可访问性分类要求的「跟随系统/浅色/深色主题、四套强调色（紫/蓝/绿/橙）、三档密度/字号/内容宽度/动效/对比度」如何在现有 design-system（schema→runtime-codegen 生成 tokens.css 受控区段）内表达，语义映射落点是什么，TailAdmin 外部复核范围与触发器是什么？'
