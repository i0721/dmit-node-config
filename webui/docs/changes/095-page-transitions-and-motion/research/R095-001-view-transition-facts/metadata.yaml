schema_version: 1
id: R095-001
title: 'Next.js 16 / React ViewTransition 页面转场能力与项目约束'
question: '当前 frontend 基座（Next.js 16 + React 19 + Tailwind v4 + HeroUI）应如何实现路由级页面转场与动效分层：运行时是否可用 View Transitions API、类型如何补齐、与项目 Token 与质量门禁约束怎样兼容？'
research_type: installed-version-and-source-audit
topics:
  ['frontend', 'page transitions', 'View Transitions API', 'React ViewTransition', 'motion tokens']
keywords:
  [
    'Next.js 16.3.3',
    'React 19.2.8',
    '@types/react 19.2.18',
    'transitionTypes',
    'view-transition-class',
    'prefers-reduced-motion',
  ]
applicable_scenarios:
  ['frontend Web Host 路由转场、动效分层、Design System 动效 Token 扩展与转场验证']
non_applicable_scenarios:
  [
    '组件级透明度动画（ui-element-system §10 禁止文字 Surface 整体 Opacity 动画）',
    'HeroUI Overlay 打开/关闭动效改造',
    '引入动画库替代 HeroUI 交互契约',
    '旧 webui/ 与 old-frontend/ 动效实现迁移',
  ]
status: active
summary: 'Next.js 16 内置 react 快照已在运行时导出 ViewTransition；官方 App Router 无需配置即可使用浏览器 View Transitions API。React 实现不产生额外 DOM，而是临时为子树宿主元素设置 view-transition-name/view-transition-class（转场后恢复），enter/exit 可按 transitionTypes 分类型解析并回退 default。@types/react 稳定版缺少 ViewTransition 类型，需以 react/canary 类型引用补齐。项目动效 Token、reduced-motion 手法与质量门禁均可兼容，无需新增依赖。'
